<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - GRC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="page">
        <div class="bg-swoosh"></div>

        <div class="swoosh-curve swoosh-curve--left">
            <svg viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <path d="M-50 400 C150 200, 350 600, 600 300 L600 800 L-50 800 Z" fill="rgba(229,57,53,0.3)"/>
                <path d="M0 500 C200 300, 400 700, 600 450 L600 800 L0 800 Z" fill="rgba(198,40,40,0.25)"/>
                <path d="M100 200 C250 100, 400 350, 550 150" stroke="rgba(255,255,255,0.08)" stroke-width="80" fill="none"/>
            </svg>
        </div>

        <div class="swoosh-curve swoosh-curve--right">
            <svg viewBox="0 0 500 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <path d="M0 100 C200 300, 300 500, 500 350 L500 0 L0 0 Z" fill="rgba(229,57,53,0.2)"/>
                <path d="M50 600 C200 450, 350 750, 500 550" stroke="rgba(255,255,255,0.06)" stroke-width="60" fill="none"/>
            </svg>
        </div>

        <div class="layout">
            <div class="branding">
                <div class="brand-circle">
                    <img class="grc-logo" src="grc.png" alt="Global Reciprocal Colleges">
                </div>
            </div>

            <div class="login-card">
                <h1>FORGOT PASSWORD</h1>

                <p class="forgot-description">
                    Enter your email address and we’ll send you a link to reset your password.
                </p>

                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter Your Email" autocomplete="email" required>
                    </div>

                    <button type="submit" class="btn-login">Send Reset Link</button>
                </form>

                <div id="successMessage" class="success-message" hidden>
                    If this email is registered, a password reset link has been sent.
                    <a href="reset-password.html" class="forgot-link">Continue to reset password</a>
                </div>

                <a href="index.html" class="forgot-link">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("forgotPasswordForm");
        const successMessage = document.getElementById("successMessage");

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            if (!email) {
                return;
            }

            form.hidden = true;
            successMessage.hidden = false;
        });
    </script>
</body>
</html>
