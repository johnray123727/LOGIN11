<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GRC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="page">
        <div class="bg-swoosh"></div>

        <div class="swoosh-curve swoosh-curve--left">
            <svg viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <path d="M-50 400 C150 200, 350 600, 600 300 L600 800 L-50 800 Z" fill="rgba(229,57,53,0.3)"/>
                <path d="M0 500 C200 300, 400 700, 600 450 L600 800 L0 800 Z" fill="rgba(198,40,40,0.25)"/>
                <path d="M100 200 C250 100, 400 350, 550 150" stroke="rgba(255,255,255,0.08)" stroke-width="80" fill="none"/>
            </svg>
        </div>

        <div class="swoosh-curve swoosh-curve--right">
            <svg viewBox="0 0 500 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <path d="M0 100 C200 300, 300 500, 500 350 L500 0 L0 0 Z" fill="rgba(229,57,53,0.2)"/>
                <path d="M50 600 C200 450, 350 750, 500 550" stroke="rgba(255,255,255,0.06)" stroke-width="60" fill="none"/>
            </svg>
        </div>

        <div class="layout">
            <div class="branding">
                <div class="brand-circle">
                    <img class="grc-logo" src="grc.png" alt="Global Reciprocal Colleges">
                </div>
            </div>

            <div class="login-card">
                <h1>RESET PASSWORD</h1>

                <p class="forgot-description">
                    Choose a new password for your account.
                </p>

                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <div class="password-field">
                            <input type="password" id="newPassword" name="newPassword" placeholder="••••••••••" autocomplete="new-password" minlength="8" required>
                            <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password" aria-pressed="false">
                                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-field">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••••" autocomplete="new-password" minlength="8" required>
                            <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password" aria-pressed="false">
                                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <p id="resetError" class="form-error" hidden>Passwords do not match.</p>

                    <button type="submit" class="btn-login">Reset Password</button>
                </form>

                <div id="successMessage" class="success-message" hidden>
                    Your password has been updated.
                    <a href="index.html" class="forgot-link">Back to Login</a>
                </div>

                <a href="index.html" class="forgot-link" id="backLink">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll(".password-toggle").forEach((toggle) => {
            toggle.addEventListener("click", () => {
                const input = document.getElementById(toggle.dataset.target);
                const showing = input.type === "password";
                input.type = showing ? "text" : "password";
                toggle.classList.toggle("is-visible", showing);
                toggle.setAttribute("aria-pressed", showing ? "true" : "false");
                toggle.setAttribute("aria-label", showing ? "Hide password" : "Show password");
            });
        });

        const form = document.getElementById("resetPasswordForm");
        const successMessage = document.getElementById("successMessage");
        const resetError = document.getElementById("resetError");
        const backLink = document.getElementById("backLink");

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const password = document.getElementById("newPassword").value;
            const confirm = document.getElementById("confirmPassword").value;

            if (password !== confirm) {
                resetError.hidden = false;
                return;
            }

            resetError.hidden = true;
            form.hidden = true;
            backLink.hidden = true;
            successMessage.hidden = false;
        });
    </script>
</body>
</html>
